<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0e0a16">
  <title>Limargeddon</title>
  <!-- Instalable en la pantalla de inicio: se abre a pantalla completa, sin barras del navegador -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Limargeddon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <button id="pauseBtn" hidden aria-label="Pausa (P)" title="Pausa (P)">II</button>
      <div class="overlay" id="menu" hidden>
        <h1>Limargeddon</h1>
        <div class="setting" id="stageSel" role="radiogroup" aria-label="Etapa"></div>
        <p class="eyebrow" id="menuEyebrow"></p>
        <p class="boss">Jefe: <b id="menuBoss"></b></p>
        <p class="tip" id="menuTip"></p>
        <div class="powers" id="menuPowers" aria-label="Bonus"></div>
        <div class="setting" id="fireSel" role="radiogroup" aria-labelledby="fireLabel">
          <span id="fireLabel">Disparo</span>
          <button class="seg" type="button" role="radio" data-fire="toque">Por toque</button>
          <button class="seg" type="button" role="radio" data-fire="acelerar">Acelerar es atacar</button>
        </div>
        <p class="tip small" id="fireTip"></p>
        <div class="row" id="menuDiffs"></div>
        <div class="row"><button class="link" id="toGarage" type="button">Taller</button><button class="snd-toggle link" type="button" aria-pressed="true">♪ Sonido: sí</button></div>
        <p class="keys desk">← → o A D para girar · ↑ o W para acelerar · Z conos · X aceite · C claxon · P pausa · M sonido</p>
      </div>
      <div class="overlay garage" id="garage" hidden>
        <div class="wallet"><span>Billetera</span><b id="gWallet">S/ 0</b></div>
        <p class="tip small" id="gGoal"></p>
        <div class="setting" id="gCats" role="tablist" aria-label="Categorías del taller"></div>
        <div class="upgrades" id="gList"></div>
        <div class="row sticky">
          <button class="pick" id="gGo" type="button">Seguir</button>
          <button class="pick alt" id="gMenu" type="button">Menú</button>
        </div>
      </div>
      <div class="overlay" id="pause" hidden>
        <h2>Pausa</h2>
        <div class="row">
          <button class="pick" id="resume" type="button">Continuar</button>
          <button class="pick alt" id="quit" type="button">Salir al menú</button>
        </div>
        <button class="snd-toggle link" type="button" aria-pressed="true">♪ Sonido: sí</button>
      </div>
      <div class="overlay" id="end" hidden>
        <p class="eyebrow" id="endEyebrow"></p>
        <h2 id="endTitle"></h2>
        <dl class="stats" id="endStats"></dl>
        <div class="badges" id="endBadges"></div>
        <div class="row">
          <button class="pick" id="next" hidden>Siguiente etapa</button>
          <button class="pick" id="again">Revancha</button>
          <button class="pick alt" id="toMenu">Dificultad</button>
        </div>
        <button class="link" id="copyLog" type="button">Copiar registro</button>
      </div>
    </div>
    <div id="deck">
      <div class="stick" id="stick" role="group" aria-label="Volante: mitad izquierda gira a la izquierda, mitad derecha a la derecha">
        <span class="l" data-z="left">&#x25C0;&#xFE0E;</span>
        <span class="r" data-z="right">&#x25B6;&#xFE0E;</span>
      </div>
      <div class="weap">
        <button class="c2" data-k="oil" id="w-oil"><i>&#x25CF;&#xFE0E;</i>ACEITE</button>
        <button class="c3" data-k="horn" id="w-horn"><i>&#x25C9;&#xFE0E;</i>CLAXON</button>
        <button class="gas" data-k="up" id="w-gas"><i>&#x25B2;&#xFE0E;</i>ACELERAR</button>
        <button class="c1" data-k="cone" id="w-cone"><i>&#x25B2;&#xFE0E;</i>CONOS<b class="ammo" id="ammo" aria-hidden="true"></b></button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
